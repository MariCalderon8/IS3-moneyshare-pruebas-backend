name: MoneyShare Backend - CI (CP-05)

# Paso 1: deteccion del push.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas-backend:
    name: Verificacion de backend y prueba unitaria CP-05
    runs-on: ubuntu-latest

    steps:
      # Paso 3: checkout del commit que activo el pipeline.
      - name: Checkout del codigo
        uses: actions/checkout@v4

      # Paso 2: aprovisionamiento del runner (sin Docker).
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # Paso 4: instalar y verificar sintaxis (backend JS, no requiere compilacion).
      - name: Instalar dependencias
        run: npm ci

      - name: Verificar sintaxis de JavaScript
        run: find src -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      # Paso 5: ejecutar exactamente una prueba unitaria (CP-05).
      - name: Prueba unitaria CP-05 y resumen de cobertura
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          npm run test:unit 2>&1 | tee reports/resultado-CP-05.txt

      - name: Publicar evidencia de la ejecucion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-prueba-CP-05
          path: reports/resultado-CP-05.txt
          if-no-files-found: warn
          retention-days: 14

# El pipeline termina en el paso 5: no incluye deploy.
