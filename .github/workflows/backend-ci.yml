name: MoneyShare Backend - CI (10 CP / 24 PU)

# Paso 1: deteccion del push / pull request / ejecucion manual.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas-backend:
    name: Verificacion de backend y pruebas unitarias (24 PU)
    runs-on: ubuntu-latest

    steps:
      # Paso 3: checkout del commit que activo el pipeline.
      - name: Checkout del codigo
        uses: actions/checkout@v4

      # Paso 2: aprovisionamiento del runner (sin Docker).
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # Paso 4: instalar y verificar sintaxis (backend JS, no requiere compilacion).
      - name: Instalar dependencias
        run: npm ci

      - name: Verificar sintaxis de JavaScript
        run: find src -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      # Paso 5: ejecutar las 24 PU (10 CP). Si alguna falla, el paso falla (pipefail).
      - name: Pruebas unitarias (24 PU) y cobertura
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          npm run test:unit 2>&1 | tee reports/resultado-pruebas-unitarias.txt

      - name: Publicar evidencia de resultados y cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-pruebas-unitarias
          path: reports/resultado-pruebas-unitarias.txt
          if-no-files-found: warn
          retention-days: 14

# El pipeline termina en el paso 5: no incluye deploy ni publicacion de paquetes.
